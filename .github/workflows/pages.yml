name: publish-version
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and main ancestry
        id: release
        run: node scripts/release-check.mjs
      - run: npm run verify:structure
      - run: npm test
      - run: npm run build -- --structure-only
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.release.outputs.deploy == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved version
        id: deployment
        uses: actions/deploy-pages@v4
