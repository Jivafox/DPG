<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="DPG — 一个收集实用工具与视觉实验的小小空间。">
  <title>DPG — Design Playground</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <a class="brand" href="./" data-home aria-label="DPG 首页"><img src="./assets/mark.svg" alt="" width="28" height="28"><span>DPG</span><span class="brand-caption">Design Playground</span></a>
    <span class="header-note"><span class="status-dot" aria-hidden="true"></span>想法的练习场</span>
  </header>
  <main id="main" tabindex="-1">
    <section id="home" class="home" aria-labelledby="home-title">
      <div class="intro">
        <p class="eyebrow">A SMALL COLLECTION OF USEFUL THINGS</p>
        <h1 id="home-title">让想法，<br>多一种玩法<span class="accent">。</span></h1>
        <p class="intro-copy">一些实用工具，一些视觉实验。<br>打开就用，看看会发生什么。</p>
        <span class="intro-index" aria-hidden="true">[ D / P / G ]</span>
      </div>
      <section class="collection" aria-labelledby="collection-title">
        <div class="section-heading"><h2 id="collection-title">全部工具 <span id="tool-count" class="count"></span></h2><span>慢慢积累，持续更新</span></div>
        <p id="catalog-status" class="notice" role="status">正在载入工具…</p>
        <button id="retry-catalog" class="button" type="button" hidden>重新加载</button>
        <div id="tool-list" class="tool-list"></div>
      </section>
      <footer class="site-footer"><span>DPG / Design Playground</span><span>从一个小小的想法开始。</span></footer>
    </section>
    <section id="detail" class="detail" hidden aria-labelledby="detail-title">
      <div class="detail-toolbar">
        <a class="back-link" href="./" data-home><span aria-hidden="true">←</span> 全部工具</a>
        <div class="detail-name"><h1 id="detail-title" tabindex="-1"></h1><span id="detail-version" class="version"></span></div>
        <a id="open-tool" class="button button-primary" target="_blank" rel="noopener">独立打开 <span aria-hidden="true">↗</span></a>
      </div>
      <div class="detail-summary"><p id="detail-description"></p><span id="detail-tags" class="tags"></span></div>
      <div id="frame-region" class="frame-region">
        <div id="frame-status" class="frame-status" role="status"><p id="frame-message">正在打开工具…</p><button id="retry-tool" class="button" type="button" hidden>重试</button></div>
      </div>
    </section>
    <section id="not-found" class="not-found" hidden aria-labelledby="error-title">
      <p class="eyebrow">NOT FOUND</p><h1 id="error-title" tabindex="-1">这个工具暂时不在这里。</h1><p>链接可能有误，或工具已下架。回首页看看其他工具吧。</p><a href="./" data-home class="button">← 返回首页</a>
    </section>
  </main>
  <noscript><p class="notice">请启用 JavaScript 查看工具列表与运行工具。</p></noscript>
</body>
</html>
